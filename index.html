<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Iterator Methods Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 2rem;
      background: #111827;
      color: #e5e7eb;
    }

    h1 {
      margin-bottom: 1rem;
    }

    section {
      background: #1f2937;
      border-radius: 0.5rem;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      border: 1px solid #374151;
    }

    h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }

    pre {
      background: #020617;
      padding: 0.75rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      font-size: 0.9rem;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      margin-bottom: 0.25rem;
    }
  </style>
  <script defer src="app.js"></script>
</head>
<body>
  <h1>Array Iterator Methods</h1>

  <section>
    <h2>map()</h2>
    <div class="label">Result</div>
    <pre><code id="map-output"></code></pre>
  </section>

  <section>
    <h2>filter()</h2>
    <div class="label">Result</div>
    <pre><code id="filter-output"></code></pre>
  </section>

  <section>
    <h2>find()</h2>
    <div class="label">Result</div>
    <pre><code id="find-output"></code></pre>
  </section>

  <section>
    <h2>findIndex()</h2>
    <div class="label">Result</div>
    <pre><code id="findindex-output"></code></pre>
  </section>

  <section>
    <h2>some()</h2>
    <div class="label">Result</div>
    <pre><code id="some-output"></code></pre>
  </section>

  <section>
    <h2>every()</h2>
    <div class="label">Result</div>
    <pre><code id="every-output"></code></pre>
  </section>

  <section>
    <h2>reduce()</h2>
    <div class="label">Result</div>
    <pre><code id="reduce-output"></code></pre>
  </section>
</body>
</html>
